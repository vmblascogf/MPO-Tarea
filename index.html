<!DOCTYPE html>
<html lang="es">
  <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Mi proyecto web</title>
  </head>
  <body>
     <h1>Bienvenido/a al sitio web de VICTOR MANUEL BLASCO GALAN</h1>
     <p>Este es un proyecto para aprender Git y GitHub.</p>

      <section id="contacto">
         <h2>Formulario de contacto</h2>
         <form action="#" method="post">
            <p>
                  <label for="nombre">Nombre:</label>
                  <input type="text" id="nombre" name="nombre" required>
            </p>
            <p>
                  <label for="email">Correo electrónico:</label>
                  <input type="email" id="email" name="email" required>
            </p>
            <p>
                  <label for="asunto">Asunto:</label>
                  <input type="text" id="asunto" name="asunto" required>
            </p>
            <p>
                  <label for="mensaje">Mensaje:</label>
                  <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
            </p>
            <button type="submit">Enviar mensaje</button>
         </form>
      </section>
      
      <section id="galeria">
            <h2>Galería de imágenes</h2>
            <div>
                  <figure>
                        <img src="https://picsum.photos/id/1018/400/300"
                        alt="Paisaje de montaña">
                        <figcaption>Paisaje de montaña</figcaption>
                  </figure>

                  <figure>
                        <img src="https://picsum.photos/id/1015/400/300"
                        alt="Río entre montañas">
                        <figcaption>Río entre montañas</figcaption>
                  </figure>

                  <figure>
                        <img src="https://picsum.photos/id/1011/400/300"
                        alt="Paisaje natural">
                        <figcaption>Paisaje natural</figcaption>
                  </figure>
                  </div>
      </section>
      <footer>
            <h2>Síguenos en redes sociales</h2>
            <nav>
                  <ul>
                        <li>
                        <a href="https://www.facebook.com/" target="_blank">
                              Facebook
                        </a>
                        </li>
                        <li>
                        <a href="https://www.instagram.com/" target="_blank">
                              Instagram
                        </a>
                        </li>
                  </ul>
            </nav>

            <p>&copy; 2026 Mi proyecto web. Todos los derechos reservados.</p>
      </footer>
  </body>
</html>
